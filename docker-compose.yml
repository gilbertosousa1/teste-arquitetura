services:

  sqlserver:
    build:
      context: ./infra/sqlserver
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD",
        "/opt/mssql-tools18/bin/sqlcmd",
        "-S", "localhost",
        "-U", "sa",
        "-P", "${SA_PASSWORD}",
        "-C",
        "-Q", "SELECT 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"

  lancamentos.api:
    build:
      context: ./src
      dockerfile: Lancamentos/Lancamentos.Api/Dockerfile
    container_name: lancamentos-api
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__lancamentosDB: "${ConnectionStrings__lancamentosDB}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: "${RABBITMQ_USER}"
      RabbitMQ__Pass: "${RABBITMQ_PASS}"

volumes:
  sqlserver_data:
